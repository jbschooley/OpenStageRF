[package]
name        = "osrf-app-link-bench"
version     = "0.1.0"
edition     = "2021"
license     = "AGPL-3.0-or-later"
description = "Milestone 4 — board-agnostic link-layer bench: LinkSender + LinkReceiver + Heartbeat + Watchdog over the SX1262 radio.  Synthetic MIDI source / sink for hardware verification before M3's MIDI FeatherWing is wired."

[dependencies]
osrf-link          = { path = "../../core/link", features = ["defmt"] }
osrf-radio-sx126x  = { workspace = true, features = ["defmt"] }
embedded-hal       = { workspace = true }
embedded-hal-async = { workspace = true }
embassy-time       = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-futures    = "0.1"
defmt              = { workspace = true }

[lib]
test    = false
doctest = false
bench   = false

defmt                             = "1.0"
embedded-hal                      = "1.0"
embedded-hal-async                = "1.0"
embedded-hal-bus                  = { version = "0.3", features = ["async"] }
embedded-storage                  = "0.3"
embedded-storage-async            = "0.4"
heapless                          = { version = "0.9", default-features = false }
sequential-storage                = { version = "5.0", features = ["defmt-03"] }

# nRF SoftDevice (BLE stack).  Pinned to git master because crates.io
# 0.1.x still depends on the legacy `nrf52840-pac` and link-collides
# with `embassy-nrf = 0.10` on `__INTERRUPTS`.  The crate officially
# targets S140 v7.x.x; on the SVC surface we touch
# (`sd_softdevice_enable`, LF clock cfg, `sd_power_dcdc_mode_set`,
# `sd_app_evt_wait`) it works fine against v6.1.1 too.  Stage 4 BLE
# work may need to revisit if specific BLE SVCs cross v6/v7 ABI
# divergence.
nrf-softdevice                    = { git = "https://github.com/embassy-rs/nrf-softdevice", rev = "5949a5b1445cc907745c6449a35577e4544cd255", features = ["nrf52840", "s140", "ble-peripheral", "critical-section-impl", "defmt"] }
nrf-softdevice-s140               = { git = "https://github.com/embassy-rs/nrf-softdevice", rev = "5949a5b1445cc907745c6449a35577e4544cd255" }

# Embedded targets are tight on flash (STM32F103C8 has 64 KB).  Optimize for
# size even in dev so debug builds fit; LTO in release shaves more.
[profile.dev]
opt-level        = "s"
debug            = true
overflow-checks  = true

[profile.release]
opt-level        = "s"
lto              = "fat"
codegen-units    = 1
debug            = true
overflow-checks  = true
[package]
name        = "osrf-profile-t114-ui"
version     = "0.1.0"
publish     = false
edition     = "2021"
license     = "AGPL-3.0-or-later"
description = "T114 UI deployment — shared library.  Provides `run()` plus all task definitions / signals / AEAD plumbing.  The three flashable binaries (`t114_ui_tx`, `t114_ui_rx`, `t114_ui_bench_tx`) are separate profile crates that depend on this and pick (Role, TxSource) at boot."

# No `[package.metadata.osrf].board` entry — this crate is library-only
# and is never flashed directly.  The three thin profile crates that
# wrap `run()` each carry their own `board = "t114"`.

[dependencies]
osrf-board-t114                = { workspace = true, features = ["defmt", "panic-stage"] }
osrf-driver-input-joystick5way = { workspace = true, features = ["defmt"] }
osrf-ui                        = { workspace = true, features = ["defmt"] }
osrf-app-midi-node             = { workspace = true }
osrf-app-link-bench            = { workspace = true }
osrf-app-ui-runtime            = { workspace = true }
osrf-panic-log                 = { workspace = true, features = ["defmt"] }

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time     = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync     = { version = "0.8" }
embassy-futures  = "0.1"
critical-section = "1"
sequential-storage = { workspace = true }
nrf-softdevice     = { workspace = true }
embedded-graphics-core = "0.4"
heapless = { workspace = true }

cortex-m    = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
defmt       = "1.0"
defmt-rtt   = "1.1"
# Panic handler: provided by `osrf-board-t114`'s `panic-stage` feature
# (enabled above).  Production builds reboot on panic instead of
# halting; defmt::error still emits the message before the reset so
# RTT-attached dev sessions see what `panic-probe` would have printed.
# **Do not** add `panic-probe` here — Rust enforces a single
# `#[panic_handler]` per binary.

[build-dependencies]
# Parse the TOML key file in build.rs to bake AEAD keys into the firmware.
toml = "0.8"

[lib]
name = "osrf_profile_t114_ui"
path = "src/lib.rs"
test = false
bench = false

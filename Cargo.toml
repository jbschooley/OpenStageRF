osrf-profile-dx-lr30-midi-tx      = { path = "profiles/dx_lr30_midi_tx" }
osrf-profile-dx-lr30-midi-rx      = { path = "profiles/dx_lr30_midi_rx" }
osrf-profile-dx-lr30-radio-tx     = { path = "profiles/dx_lr30_radio_tx" }
osrf-profile-dx-lr30-radio-rx     = { path = "profiles/dx_lr30_radio_rx" }
osrf-profile-dx-lr30-tx-basic     = { path = "profiles/dx_lr30_tx_basic" }
osrf-profile-dx-lr30-rx-basic     = { path = "profiles/dx_lr30_rx_basic" }
osrf-profile-dx-lr30-rx-diversity = { path = "profiles/dx_lr30_rx_diversity" }

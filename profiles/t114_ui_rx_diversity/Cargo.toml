[package]
name        = "osrf-profile-t114-ui-rx-diversity"
version     = "0.1.0"
publish     = false
edition     = "2021"
license     = "AGPL-3.0-or-later"
description = "T114 UI deployment — receiver binary with dual-SPI receive diversity (on-board SX1262 + header-wired DX-LR30 on SPI3). Same UI/link/soft-off stack as t114_ui_rx; both radios feed one shared receiver and live reconfigure/scan retune both."

[package.metadata.osrf]
board = "t114"

[dependencies]
osrf-board-t114      = { workspace = true, features = ["defmt", "panic-stage"] }
osrf-profile-t114-ui = { path = "../t114_ui" }
osrf-ui              = { workspace = true, features = ["defmt"] }

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }

cortex-m    = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
defmt-rtt   = "1.1"

[[bin]]
name  = "ui_rx_diversity"
path  = "src/main.rs"
test  = false
bench = false

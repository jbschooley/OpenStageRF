[package]
name        = "osrf-board-t114"
version     = "0.1.0"
edition     = "2021"
license     = "AGPL-3.0-or-later"
description = "Heltec Mesh Node T114 v2.0 — nRF52840 + SX1262 + ST7789 TFT"

# xtask reads this block to pick the rustc target.
[package.metadata.osrf]
target = "thumbv7em-none-eabihf"
mcu    = "nrf52840"

[features]
defmt = ["dep:defmt", "embassy-nrf/defmt", "osrf-radio-sx126x/defmt"]

[dependencies]
defmt       = { version = "1.0", optional = true }
# nfc-pins-as-gpio: P0_09/P0_10 are NFC-dedicated by default.  T114 wires
# them to the P1 header as a general-purpose UART, so we must opt in.
embassy-nrf = { version = "0.10", features = ["nrf52840", "time-driver-rtc1", "gpiote", "nfc-pins-as-gpio"] }
cortex-m    = "0.7"

# embedded-hal trait surface — exposed by the board API so apps can drive
# peripherals through HAL-agnostic interfaces.
embedded-hal       = { workspace = true }
embedded-hal-async = { workspace = true }
embedded-hal-bus   = { workspace = true }
embassy-time       = { version = "0.5" }
osrf-radio-sx126x  = { workspace = true }

[lib]
test    = false
doctest = false
bench   = false

# ── dev-dependencies — only used by examples/ (smoke test, etc.) ─────────────
[dev-dependencies]
cortex-m         = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt      = "0.7"
defmt            = "1.0"
defmt-rtt        = "1.1"
panic-probe      = { version = "1.0", features = ["print-defmt"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time     = { version = "0.5",  features = ["defmt", "defmt-timestamp-uptime"] }
embassy-nrf      = { version = "0.10", features = ["nrf52840", "time-driver-rtc1", "gpiote", "nfc-pins-as-gpio", "defmt"] }

[[example]]
name  = "smoke"
test  = false
bench = false

[package]
name        = "osrf-app-radio-bench"
version     = "0.1.0"
edition     = "2021"
license     = "AGPL-3.0-or-later"
description = "Milestone 2 — board-agnostic SX1262 bench test (TX and RX loops)"

[dependencies]
osrf-radio-sx126x  = { workspace = true, features = ["defmt"] }
embedded-hal       = { workspace = true }
embedded-hal-async = { workspace = true }
embassy-time       = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-futures    = "0.1"
defmt              = { workspace = true }

[lib]
test    = false
doctest = false
bench   = false

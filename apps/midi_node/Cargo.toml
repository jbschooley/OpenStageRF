[package]
name        = "osrf-app-midi-node"
version     = "0.1.0"
edition     = "2021"
license     = "AGPL-3.0-or-later"
description = "Milestone 4 integration: real DIN MIDI over the wireless link layer.  Wraps osrf-link-runtime with UART-backed MidiSource (parses keyboard MIDI in via osrf-midi-din) and MidiSink (writes events out to a synth's MIDI in)."

[dependencies]
osrf-link-runtime  = { workspace = true }
osrf-midi-din      = { workspace = true, features = ["defmt"] }
embedded-io-async  = { version = "0.7" }
embassy-time       = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
heapless           = { workspace = true }
defmt              = { workspace = true }

[lib]
test    = false
doctest = false
bench   = false

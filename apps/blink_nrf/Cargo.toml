[package]
name        = "osrf-app-blink-nrf"
version     = "0.1.0"
edition     = "2021"
license     = "AGPL-3.0-or-later"
description = "Milestone 0 blink — nRF platform variant.  Bin source is shared with apps/blink/."

# Standalone — own workspace.  Cannot share with the main (STM32) workspace
# because embassy-nrf and embassy-stm32 both link the native
# `embassy-time-queue` library at incompatible versions.
[workspace]

[features]
t114 = []

# Silence the cfg warning for `dx_lr30` (lives in apps/blink, not here).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("dx_lr30"))'] }

[dependencies]
osrf-board-t114 = { path = "../../boards/t114", features = ["defmt"] }

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time     = { version = "0.5",  features = ["defmt", "defmt-timestamp-uptime"] }

cortex-m    = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt       = "1.0"
defmt-rtt   = "1.1"
panic-probe = { version = "1.0", features = ["print-defmt"] }

# Same source file as apps/blink — cfg-gated `use` selects the right board.
[[bin]]
name              = "t114"
path              = "../blink/src/blink.rs"
required-features = ["t114"]

[package]
name        = "osrf-profile-t114-ui-demo"
version     = "0.1.0"
publish     = false
edition     = "2021"
license     = "AGPL-3.0-or-later"
description = "UI bench demo — T114 deployment.  Drives the built-in ST7789 TFT through osrf-app-ui-bench."

[package.metadata.osrf]
board = "t114"

[features]
default = []
# Route bin-level logging over USB-CDC.  See profiles/t114_blink/Cargo.toml
# for the full description of the tradeoff.
usb-log = ["osrf-board-t114/usb-log", "dep:log"]

[dependencies]
osrf-board-t114   = { workspace = true, features = ["defmt"] }
osrf-app-ui-bench = { workspace = true }

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time     = { version = "0.5" }

cortex-m    = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
defmt       = "1.0"
defmt-rtt   = "1.1"
panic-probe = { version = "1.0", features = ["print-defmt"] }
log         = { version = "0.4", optional = true }

# To impl FlushAsync for the board's St7789Display newtype.
embedded-graphics-core = "0.4"

[[bin]]
name  = "ui_demo"
path  = "src/main.rs"
test  = false
bench = false

[package]
name        = "osrf-link-runtime"
version     = "0.1.0"
edition     = "2021"
license     = "AGPL-3.0-or-later"
description = "Board-agnostic link-layer node runtime: TX / RX async loops over osrf-link + osrf-radio-sx126x, generic over MidiSource / MidiSink.  Used by both osrf-app-link-bench (synthetic source) and osrf-app-midi-node (real DIN MIDI I/O)."

[dependencies]
osrf-link          = { path = "../link", features = ["defmt"] }
osrf-radio-sx126x  = { workspace = true, features = ["defmt"] }
embedded-hal       = { workspace = true }
embedded-hal-async = { workspace = true }
embassy-time       = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-futures    = "0.1"
embassy-sync       = "0.8"
heapless           = { workspace = true }
defmt              = { workspace = true }
# Cross-task shared state for `LinkStatsCell` — a `Mutex<Cell<LinkStats>>`
# the runtime writes and consumers (UI, telemetry) read.  Critical-section
# impl is provided by whichever profile crate links us (cortex-m on
# bare-metal builds, nrf-softdevice on SD-aware builds).
critical-section   = "1"

[lib]
test    = false
doctest = false
bench   = false

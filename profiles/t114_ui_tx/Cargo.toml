[package]
name        = "osrf-profile-t114-ui-tx"
version     = "0.1.0"
publish     = false
edition     = "2021"
license     = "AGPL-3.0-or-later"
description = "T114 UI deployment — transmitter binary (UART MIDI source).  Thin shell over `osrf-profile-t114-ui` (lib) that picks Role::Tx + TxSource::Uart at boot."

[package.metadata.osrf]
board = "t114"

[dependencies]
osrf-board-t114      = { workspace = true, features = ["defmt", "panic-stage"] }
osrf-profile-t114-ui = { path = "../t114_ui" }
osrf-ui              = { workspace = true, features = ["defmt"] }

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }

cortex-m    = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
defmt-rtt   = "1.1"
# Panic handler: `osrf-board-t114`'s `panic-stage` feature provides
# `#[panic_handler]`.  Do **not** also pull in `panic-probe`.

[[bin]]
name  = "ui_tx"
path  = "src/main.rs"
test  = false
bench = false

name: dx_lr30_rx_basic
description: First-edition receiver — DX-LR30, single SX1262, US 915 ISM, GFSK MIDI
app: midi_node
role: rx
board: dx_lr30
port: stm32_hal

features:
  display: ssd1306_i2c     # optional add-on for tuning UI
  input: gpio_buttons      # optional add-on
  diversity: none
  midi_out: din_uart

radio:
  driver: sx126x
  count: 1
  band: us_915
  frequency_hz: 915000000
  bitrate: 300000
  modulation: gfsk

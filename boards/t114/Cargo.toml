[package]
name        = "osrf-board-t114"
version     = "0.1.0"
edition     = "2021"
license     = "AGPL-3.0-or-later"
description = "Heltec Mesh Node T114 v2.0 — nRF52840 + SX1262 + ST7789 TFT"

# xtask reads this block to pick the rustc target.
[package.metadata.osrf]
target = "thumbv7em-none-eabihf"
mcu    = "nrf52840"

[features]
defmt = ["dep:defmt", "embassy-nrf/defmt", "osrf-radio-sx126x/defmt"]
# Opt-in USB-CDC `log` transport.  Brings in embassy-usb + embassy-usb-logger
# and exposes the `usb_log::spawn()` helper.  The bin must call
# `resources_with(clocks::usb_config())` (HFXO required for USB) before
# spawning the logger task.
#
# Tradeoff: only `log::info!()` etc. is visible on the USB-CDC virtual
# serial port — `defmt::info!()` calls from app crates still go to RTT
# (which is unreachable without a debug probe).  See README of the bin
# crates for the full story.
usb-log = ["dep:embassy-usb", "dep:embassy-usb-logger", "dep:log"]

[dependencies]
defmt       = { version = "1.0", optional = true }
# nfc-pins-as-gpio: P0_09/P0_10 are NFC-dedicated by default.  T114 wires
# them to the P1 header as a general-purpose UART, so we must opt in.
embassy-nrf = { version = "0.10", features = ["nrf52840", "time-driver-rtc1", "gpiote", "nfc-pins-as-gpio"] }
cortex-m    = "0.7"

# embedded-hal trait surface — exposed by the board API so apps can drive
# peripherals through HAL-agnostic interfaces.
embedded-hal       = { workspace = true }
embedded-hal-async = { workspace = true }
embedded-hal-bus   = { workspace = true }
embassy-time       = { version = "0.5" }
embassy-executor   = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
osrf-radio-sx126x  = { workspace = true }

# ── Display: ST7789 240×135 colour TFT on TWISPI1 (SPI mode) ────────────────
# Hand-rolled driver in `src/display.rs` — replaces the prior mipidsi
# path which hung during init on this hardware.  We just need the
# embedded-graphics-core trait surface to implement `DrawTarget` for
# the panel; `heapless` is for a fixed-size row buffer in the
# `fill_contiguous` path.
embedded-graphics-core = "0.4"
heapless               = { workspace = true }

# ── usb-log feature deps ─────────────────────────────────────────────────────
# embassy-usb-driver is already pulled in transitively by embassy-nrf 0.10
# (which depends on it at ^0.2).  embassy-usb 0.6 / embassy-usb-logger 0.6
# pin the same major, so resolution is conflict-free.
embassy-usb        = { version = "0.6", optional = true }
embassy-usb-logger = { version = "0.6", optional = true }
log                = { version = "0.4", optional = true }

# ── SoftDevice (always enabled on T114 to avoid clobbering the Heltec
# stock bootloader's bundled SD on flash, and so we don't have to
# replicate SD's POWER/CLOCK/sleep management by hand).
nrf-softdevice      = { workspace = true }
nrf-softdevice-s140 = { workspace = true }
osrf-panic-log      = { workspace = true }

[lib]
test    = false
doctest = false
bench   = false

# ── dev-dependencies — only used by examples/ (smoke test, etc.) ─────────────
[dev-dependencies]
cortex-m         = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt      = "0.7"
defmt            = "1.0"
defmt-rtt        = "1.1"
panic-probe      = { version = "1.0", features = ["print-defmt"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time     = { version = "0.5",  features = ["defmt", "defmt-timestamp-uptime"] }
embassy-nrf      = { version = "0.10", features = ["nrf52840", "time-driver-rtc1", "gpiote", "nfc-pins-as-gpio", "defmt"] }

[[example]]
name  = "smoke"
test  = false
bench = false

[[example]]
name  = "bare_blink"
test  = false
bench = false

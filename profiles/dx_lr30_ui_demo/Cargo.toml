[package]
name        = "osrf-profile-dx-lr30-ui-demo"
version     = "0.1.0"
publish     = false
edition     = "2021"
license     = "AGPL-3.0-or-later"
description = "UI bench demo — DX-LR30 deployment.  Drives the SSD1306 OLED through osrf-app-ui-bench."

[package.metadata.osrf]
board = "dx_lr30"

[dependencies]
osrf-board-dx-lr30 = { workspace = true, features = ["defmt"] }
osrf-app-ui-bench  = { workspace = true }

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time     = { version = "0.5" }

cortex-m    = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt       = "1.0"
defmt-rtt   = "1.1"
panic-probe = { version = "1.0", features = ["print-defmt"] }

# We name the board's concrete display type to impl FlushAsync for it.
# display-interface is the crate that owns DisplayError — ssd1306 0.10
# returns it from flush() but doesn't re-export the type.
ssd1306                = { version = "0.10", default-features = false, features = ["async", "graphics"] }
display-interface      = "0.5"
embedded-graphics-core = "0.4"

[[bin]]
name  = "ui_demo"
path  = "src/main.rs"
test  = false
bench = false

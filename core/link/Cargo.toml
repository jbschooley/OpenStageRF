[package]
name    = "osrf-link"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[features]
defmt = ["dep:defmt", "osrf-protocols-midi-v1/defmt"]

[dependencies]
defmt                    = { workspace = true, optional = true }
embassy-time             = { version = "0.5" }
embedded-hal             = { workspace = true }
heapless                 = { workspace = true }
osrf-protocols-midi-v1   = { path = "../../protocols/midi_packet_v1" }

[lib]
# Host-side unit tests cover the replay window, sender, and receiver
# end-to-end.  Same convention as the protocol crate — we want these
# tests despite the project-wide `test = false` default because link-
# layer correctness is the kind of thing that benefits enormously from
# them.
test    = true
doctest = false
bench   = false

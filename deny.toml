[licenses]
# Licenses allowed for dependencies.  Our own crates use AGPL-3.0-or-later.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "AGPL-3.0-or-later",
]
unused-allowed-license = "warn"

[bans]
multiple-versions = "warn"
wildcards         = "deny"

[advisories]
ignore = []

[package]
name        = "osrf-profile-t114-ui-rx"
version     = "0.1.0"
publish     = false
edition     = "2021"
license     = "AGPL-3.0-or-later"
description = "T114 UI deployment — receiver binary (UART MIDI sink).  Pairs with `t114_ui_tx` or `t114_ui_bench_tx`; auto-decrypts encrypted packets matching the configured test key and passes through plaintext when the peer is in Open mode."

[package.metadata.osrf]
board = "t114"

[dependencies]
osrf-board-t114      = { workspace = true, features = ["defmt", "panic-stage"] }
osrf-profile-t114-ui = { path = "../t114_ui" }
osrf-ui              = { workspace = true, features = ["defmt"] }

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }

cortex-m    = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
defmt-rtt   = "1.1"

[[bin]]
name  = "ui_rx"
path  = "src/main.rs"
test  = false
bench = false

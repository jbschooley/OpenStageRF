name        = "nrf5340_dual_si4463"
description = "v3 audio expansion board — nRF5340 (dual M33) + 2× Si4463 + audio front-end"
mcu         = "nrf5340"
port        = "embassy_nrf"
target      = "thumbv7em-none-eabihf"

# Same dual-core nRF5340 as v2: app core handles radio link, codec, audio I/O,
# crypto, and UI; net core runs BLE softdevice for config/pairing only.
# Both radios share SPI0 (identical wiring pattern to nrf5340_dual_sx1262).
diversity_modes = ["single", "uart_slave", "dual_spi_same_bus"]

[cores.app]
cpu    = "cortex_m33"
crypto = "cryptocell_cc312"  # AES-CCM, AES-256, SHA-256, TRNG

[cores.net]
cpu  = "cortex_m33"
role = "ble"                 # softdevice for config/pairing only — not for audio

[radios.radio0]
type = "si446x"
chip = "si4463"
spi  = "SPI0"
cs   = "TBD"
irq  = "TBD"   # nIRQ output
sdn  = "TBD"   # shutdown / reset

[radios.radio1]
type = "si446x"
chip = "si4463"
spi  = "SPI0"  # shared bus
cs   = "TBD"
irq  = "TBD"
sdn  = "TBD"

[audio.codec]
type        = "tlv320aic3204"
bus         = "I2S0"
control_bus = "I2C0"

[audio.inputs.mic]
type          = "balanced_xlr"
preamp        = "enabled"
phantom_power = "48v"   # selectable per channel

[audio.inputs.instrument]
type      = "trs_balanced"
impedance = "high_z"    # for direct guitar/bass input

[audio.outputs.headphone]
type      = "stereo_trs"
amp       = "instrumentation_grade"
max_level = "line_plus"

[power]
audio_rail   = "ldo_low_noise"
digital_rail = "smps"
isolation    = true

[workspace]
members = [
    "apps/blink",
    "apps/midi_node",
    "boards/dx_lr30",
    "boards/t114",
    "core/link",
    "crypto",
    "drivers/radio/sx126x",
    "ports/embassy_stm32",
    "profiles/dx_lr30_blink",
    "profiles/dx_lr30_rx_basic",
    "profiles/dx_lr30_rx_diversity",
    "profiles/dx_lr30_tx_basic",
    "profiles/t114_blink",
    "profiles/t114_rx_basic",
    "profiles/t114_rx_diversity",
    "profiles/t114_tx_basic",
    "protocols/midi_packet_v1",
    "xtask",
]
# default-members excludes nRF crates (thumbv7em-none-eabihf) and xtask (host
# tool) — `.cargo/config.toml` sets the default target to thumbv7m-none-eabi.
default-members = [
    "apps/blink",
    "apps/midi_node",
    "boards/dx_lr30",
    "core/link",
    "crypto",
    "drivers/radio/sx126x",
    "ports/embassy_stm32",
    "profiles/dx_lr30_blink",
    "profiles/dx_lr30_rx_basic",
    "profiles/dx_lr30_rx_diversity",
    "profiles/dx_lr30_tx_basic",
    "protocols/midi_packet_v1",
]
resolver = "2"

[workspace.dependencies]
osrf-app-blink                    = { path = "apps/blink" }
osrf-board-dx-lr30                = { path = "boards/dx_lr30" }
osrf-board-t114                   = { path = "boards/t114" }
osrf-profile-dx-lr30-blink        = { path = "profiles/dx_lr30_blink" }
osrf-profile-dx-lr30-tx-basic     = { path = "profiles/dx_lr30_tx_basic" }
osrf-profile-dx-lr30-rx-basic     = { path = "profiles/dx_lr30_rx_basic" }
osrf-profile-dx-lr30-rx-diversity = { path = "profiles/dx_lr30_rx_diversity" }
osrf-profile-t114-blink           = { path = "profiles/t114_blink" }
osrf-profile-t114-tx-basic        = { path = "profiles/t114_tx_basic" }
osrf-profile-t114-rx-basic        = { path = "profiles/t114_rx_basic" }
osrf-profile-t114-rx-diversity    = { path = "profiles/t114_rx_diversity" }
defmt                             = "1.0"
embedded-hal                      = "1.0"
embedded-hal-async                = "1.0"
embedded-hal-bus                  = "0.3"
heapless                          = { version = "0.9", default-features = false }
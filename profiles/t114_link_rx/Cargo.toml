[package]
name        = "osrf-profile-t114-link-rx"
version     = "0.1.0"
edition     = "2021"
license     = "AGPL-3.0-or-later"
description = "Milestone 4 link bench RX — T114 deployment of osrf-app-link-bench with the synthetic DefmtLogSink."

[package.metadata.osrf]
board = "t114"

[dependencies]
osrf-board-t114     = { workspace = true, features = ["defmt"] }
osrf-app-link-bench = { workspace = true }

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }

cortex-m    = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt       = "1.0"
defmt-rtt   = "1.1"
panic-probe = { version = "1.0", features = ["print-defmt"] }

[[bin]]
name  = "link_rx"
path  = "src/main.rs"
test  = false
bench = false

# T114 UI receiver with dual-SPI receive diversity, 470–514 MHz (CN470/SX1268).
app        = "t114_ui"
board      = "t114"
role       = "rx"
name       = "Stage RX Div 470"
diversity  = true
band_plans = ["band470", "shure_g58_*", "senn_a1_*"]
power_policy = "wired"
battery      = "lipo"
keys       = "osrf-keys.toml"

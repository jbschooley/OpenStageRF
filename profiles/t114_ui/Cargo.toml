[package]
name        = "osrf-profile-t114-ui"
version     = "0.1.0"
edition     = "2021"
license     = "AGPL-3.0-or-later"
description = "Milestone 6 UI smoke test — T114 deployment.  Drives the built-in 1.14″ ST7789 TFT plus an externally-wired 5-way joystick through osrf-ui."

[package.metadata.osrf]
board = "t114"

[dependencies]
osrf-board-t114                = { workspace = true, features = ["defmt", "softdevice"] }

# nrf-softdevice's `critical-section-impl` provides the global
# critical-section impl when the SoftDevice owns interrupt forwarding.
# `cortex-m`'s `critical-section-single-core` would collide (both
# define `_critical_section_1_0_acquire`); leave cortex-m without the
# feature when softdevice is on.
osrf-driver-input-joystick5way = { workspace = true, features = ["defmt"] }
osrf-ui                        = { workspace = true, features = ["defmt"] }

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time     = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync     = { version = "0.8" }
embassy-futures  = "0.1"
embedded-graphics-core = "0.4"

cortex-m    = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
defmt       = "1.0"
defmt-rtt   = "1.1"
panic-probe = { version = "1.0", features = ["print-defmt"] }

[lib]
name = "osrf_profile_t114_ui"
path = "src/lib.rs"
test = false
bench = false

[[bin]]
name  = "ui_rx"
path  = "src/bin/ui_rx.rs"
test  = false
bench = false

[[bin]]
name  = "ui_tx"
path  = "src/bin/ui_tx.rs"
test  = false
bench = false

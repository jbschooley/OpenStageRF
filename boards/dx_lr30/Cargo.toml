[package]
name        = "osrf-board-dx-lr30"
version     = "0.1.0"
edition     = "2021"
license     = "AGPL-3.0-or-later"
description = "DX-LR30-900M22SP dev board — STM32F103C8T6 + DX-LR30-900M22S (SX1262)"

# xtask reads this block to pick the rustc target.
[package.metadata.osrf]
target = "thumbv7m-none-eabi"
mcu    = "stm32f103c8t6"

[features]
defmt = ["dep:defmt", "embassy-stm32/defmt", "osrf-radio-sx126x/defmt"]
# Use HSI (internal 8 MHz oscillator) instead of HSI+PLL.
# Safe for initial bring-up when crystal presence is unconfirmed.
hsi = []

[dependencies]
defmt              = { workspace = true, optional = true }
embassy-stm32      = { version = "0.6", features = ["stm32f103c8", "time-driver-any", "exti"] }
cortex-m           = "0.7"

# embedded-hal trait surface — exposed by the board API so apps can drive
# peripherals through HAL-agnostic interfaces.
embedded-hal       = { workspace = true }
embedded-hal-async = { workspace = true }
embedded-hal-bus   = { workspace = true }
embassy-time       = { version = "0.5" }
osrf-radio-sx126x  = { workspace = true }

[lib]
test    = false
doctest = false
bench   = false

# ── dev-dependencies — only used by examples/ (smoke test, etc.) ─────────────
[dev-dependencies]
cortex-m         = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt      = "0.7"
defmt            = "1.0"
defmt-rtt        = "1.1"
panic-probe      = { version = "1.0", features = ["print-defmt"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time     = { version = "0.5",  features = ["defmt", "defmt-timestamp-uptime"] }
embassy-stm32    = { version = "0.6",  features = ["stm32f103c8", "time-driver-any", "defmt"] }

[[example]]
name  = "smoke"
test  = false
bench = false

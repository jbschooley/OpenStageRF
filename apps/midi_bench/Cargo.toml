[package]
name        = "osrf-app-midi-bench"
version     = "0.1.0"
edition     = "2021"
license     = "AGPL-3.0-or-later"
description = "Milestone 3 — board-agnostic DIN MIDI bench (RX parser + TX arpeggiator)"

[dependencies]
osrf-midi-din      = { workspace = true, features = ["defmt"] }
embedded-hal       = { workspace = true }
embedded-hal-async = { workspace = true }
embedded-io-async  = "0.7"
embassy-time       = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
defmt              = { workspace = true }

[lib]
test    = false
doctest = false
bench   = false

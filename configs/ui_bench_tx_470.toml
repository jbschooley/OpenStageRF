# T114 UI transmitter on the synthetic scenario source, 470–514 MHz.
app       = "t114_ui"
board     = "t114"
role      = "tx"
name      = "Bench TX 470"
tx_source = "scenario"
diversity = false
band_plans = ["band470", "shure_g58_*", "senn_a1_*"]
power_policy = "wired"
battery      = "lipo"
keys      = "osrf-keys.toml"

name: t114_rx_diversity
description: Stage 2.5 receiver — Heltec T114 (nRF52840 + SX1262), validates multi-vendor portability
app: midi_node
role: rx
board: t114
port: embassy_nrf

features:
  display: ssd1306_i2c     # optional add-on
  input: gpio_buttons      # optional add-on
  diversity: uart_slave    # paired with a second T114 or DX-LR30 forwarding RxReports
  midi_out: din_uart
  encryption: aes_128_ccm  # nRF52840 has hardware CCM peripheral

radio:
  driver: sx126x
  count: 1
  band: us_915
  frequency_hz: 915000000
  bitrate: 300000
  modulation: gfsk

[package]
name        = "osrf-profile-t114-ui-app"
version     = "0.1.0"
publish     = false
edition     = "2021"
license     = "AGPL-3.0-or-later"
description = "Generic flashable T114 UI binary. Configured at build time by a TOML profile (configs/*.toml) via the OSRF_PROFILE env var — role / tx_source / diversity / band are baked in by build.rs. Flash with `cargo xtask run <profile>`."

[package.metadata.osrf]
board = "t114"

[dependencies]
osrf-board-t114      = { workspace = true, features = ["defmt", "panic-stage"] }
osrf-profile-t114-ui = { path = "../t114_ui" }
osrf-ui              = { workspace = true, features = ["defmt"] }

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }

cortex-m    = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
defmt-rtt   = "1.1"

[build-dependencies]
toml = "0.8"

[[bin]]
name  = "ui"
path  = "src/main.rs"
test  = false
bench = false

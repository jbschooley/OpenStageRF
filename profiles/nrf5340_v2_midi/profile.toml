name        = "nrf5340_v2_midi"
description = "v2 custom MIDI board — nRF5340 + 2× SX1262, dual-SPI diversity, BLE config, hardware crypto. MIDI scope only."
app         = "midi_node"
role        = "rx"
board       = "nrf5340_dual_sx1262"
port        = "embassy_nrf"

[diversity]
mode = "dual_spi_same_bus"  # both radios on SPI0 — see PLAN.md Decision #4

[features]
display      = "ssd1306_i2c"
input        = "gpio_buttons"
midi_out     = "din_uart"
encryption   = "aes_128_ccm"  # CryptoCell CC312 hardware path
ble_config   = "enabled"      # net core runs BLE softdevice for pairing/config
key_provider = "ble_config"   # keys negotiated at pairing rather than hardcoded

[radio]
driver       = "sx126x"
count        = 2
band         = "us_915"
frequency_hz = 915000000
bitrate      = 300000
modulation   = "gfsk"

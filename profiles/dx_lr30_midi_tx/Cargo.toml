[package]
name        = "osrf-profile-dx-lr30-midi-tx"
version     = "0.1.0"
publish     = false
edition     = "2021"
license     = "AGPL-3.0-or-later"
description = "Milestone 3 MIDI bench TX — DX-LR30 deployment of osrf-app-midi-bench."

[package.metadata.osrf]
board = "dx_lr30"

[dependencies]
osrf-board-dx-lr30  = { workspace = true, features = ["defmt"] }
osrf-app-midi-bench = { workspace = true }

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }

cortex-m    = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt       = "1.0"
defmt-rtt   = "1.1"
panic-probe = { version = "1.0", features = ["print-defmt"] }

[[bin]]
name  = "midi_tx"
path  = "src/main.rs"
test  = false
bench = false

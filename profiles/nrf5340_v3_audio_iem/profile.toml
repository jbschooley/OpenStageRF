name        = "nrf5340_v3_audio_iem"
description = "v3 audio board — stereo IEM with true 2-radio diversity at broadcast quality (PCM 16-bit / 24 kHz stereo, no codec). Recommended default IEM profile."
app         = "audio_node"
role        = "rx"
board       = "nrf5340_dual_si4463"
port        = "embassy_nrf"

[diversity]
mode = "dual_spi_same_bus"  # both radios same channel, true diversity

[features]
display      = "ssd1306_i2c"
input        = "gpio_buttons"
audio_in     = "none"
audio_out    = "stereo_headphone"
encryption   = "aes_128_ccm"    # CryptoCell CC312 hardware path
ble_config   = "enabled"
key_provider = "ble_config"

[radio]
driver        = "si446x"
count         = 2
band          = "us_915"
frequency_hz  = 915000000
bitrate       = 768000           # matches PCM 16-bit / 24 kHz stereo
modulation    = "4gfsk"          # 4-GFSK halves channel BW vs 2-GFSK
channel_bw_hz = 500000

[audio]
codec                = "pcm_24k_16bit_stereo"
sample_rate          = 24000
bit_depth            = 16
channels             = 2
jitter_buffer_frames = 2

osrf-profile-t114-midi-tx         = { path = "profiles/t114_midi_tx" }
osrf-profile-t114-midi-rx         = { path = "profiles/t114_midi_rx" }
osrf-profile-t114-midi-node-tx    = { path = "profiles/t114_midi_node_tx" }
osrf-profile-t114-midi-node-rx    = { path = "profiles/t114_midi_node_rx" }
osrf-profile-t114-radio-tx        = { path = "profiles/t114_radio_tx" }
osrf-profile-t114-radio-rx        = { path = "profiles/t114_radio_rx" }
osrf-profile-t114-tx-basic        = { path = "profiles/t114_tx_basic" }
osrf-profile-t114-rx-basic        = { path = "profiles/t114_rx_basic" }

[package]
name        = "osrf-app-ui-bench"
version     = "0.1.0"
publish     = false
edition     = "2021"
license     = "AGPL-3.0-or-later"
description = "Board-agnostic UI bench — draws a frame counter to any embedded-graphics DrawTarget."

[dependencies]
embedded-graphics-core = "0.4"
embedded-graphics      = "0.8"
embassy-time           = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
defmt                  = { workspace = true }
heapless               = { workspace = true }

[lib]
test    = false
doctest = false
bench   = false
